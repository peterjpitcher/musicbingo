name: CI

# Lint, types, unit tests, build and a full migration replay on every pull
# request and every push to main. Modelled on OJ-CashBingo's workflow.
#
# Not run here, to keep the Actions minutes down: the Playwright flows
# (npm run test:e2e) and the legacy Python generator tests (npm run test:py).
# Both still run locally through npm run verify.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # .nvmrc pins Node 24 to match the Vercel project (Node.js 24.x).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --allow-git=all: @anchor-nights/kit is a git dependency (a pinned tag).
      - name: Install
        run: npm ci --allow-git=all

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Run twice: Europe/London is the business zone, UTC is what Vercel's
      # serverless runtime uses. Dates are this workspace's most repeated bug.
      # Each script pins its own zone, so CI and a laptop run the same pair.
      - name: Unit tests (Europe/London)
        run: npm test

      - name: Unit tests (UTC)
        run: npm run test:utc

      # Staff sign-in (M-8) needs the kit's auth variables on every build, and
      # private links (M-9) their own signing key (lib/buildEnv.mjs). These are
      # placeholders, not secrets: a dummy Supabase project, Cloudflare's
      # published always-pass Turnstile test keys, a throwaway HMAC key and a
      # throwaway link key. Nothing here can reach a real service.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          AUDIT_HMAC_KEY: v1:ci-placeholder-not-a-secret-0123456789abcdef
          LIVE_LINK_SECRET: ci-placeholder-link-secret-not-real
        run: npm run build

  database:
    name: Migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # A throwaway database in the service container; nothing here can reach
      # the production Supabase project.
      - name: Replay every migration
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/tests/replay.sh

      # The anon guard (scripts/check-anon-access.mjs) proves its own
      # comparison, then reads the replayed database's catalogue: the public
      # key must reach nothing beyond supabase/anon-access-allowlist.mjs.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Anon access guard (self-test)
        run: node scripts/check-anon-access.mjs --self-test

      - name: Anon access guard (replayed database)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/music_bingo_replay_test
        run: node scripts/check-anon-access.mjs
